# Publishes only the public website to GitHub Pages.
# Internal tooling (tools/, launcher/, cloudflare/, build scripts, release
# notes, data backups) stays in the repo but is never served.
#
# One-time setup: GitHub repo -> Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs (GitHub's official Pages template).
  # In one job, deploy-pages sometimes ran before the artifact was finalized and
  # failed with 'No artifacts named "github-pages" were found' (3 of 5 runs, 2026-11-25).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect public files
        run: |
          set -euo pipefail
          mkdir -p _site/data
          # Root files served by the site.
          for f in index.html 404.html CNAME robots.txt sitemap.xml llms.txt site.webmanifest \
                   favicon.ico bgstudio3d.ico apple-touch-icon.png .nojekyll; do
            if [ -e "$f" ]; then cp "$f" _site/; fi
          done
          cp -r assets _site/
          # Product feeds for Google Merchant Center and Meta/WhatsApp catalog.
          cp -r feeds _site/
          # main.js reads this at runtime; the other data files are build input.
          cp data/site_settings.json _site/data/
          # Every top-level page folder (has an index.html), except internal ones.
          for d in */; do
            d="${d%/}"
            case "$d" in tools|launcher|cloudflare|data|assets|_site) continue ;; esac
            if [ -f "$d/index.html" ]; then cp -r "$d" _site/; fi
          done
          echo "Published files: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
